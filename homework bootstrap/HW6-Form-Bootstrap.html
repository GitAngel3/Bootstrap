<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedbackform for online bakery</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</head>
<body>

    <div class="container">
     <h3 class="display-6 text-success">Thrive bakery feedback form</h3>
    <form>
  <div class="form-group">
    <div class="form-group">
      <label for="name">Name:</label>
      <input type="text" class="form-control" placeholder="Enter name" name="fname">
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" placeholder="Enter email" name="email">
    </div>
    <div class="form-group">
      <label for="comment">Feedback Message:</label>
      <textarea class="form-control" rows="3" id="comment"></textarea>
    </div>

    <div class="form-group">
  <label for="sel1"> Preferred contact method :</label>
  <select class="form-control" id="sel1">
    <option disabled>select</option>
    <option>Email</option>
    <option>Phone</option>
  </select>
</div>



<div class="form-group">
      <input type="range" class="form-control-range" name="range">
    </div>
  
<div class="form-group">
  <label for="sel1"> Type of order :</label>
  <select class="form-control" id="sel1">
    <option disabled action>select</option>
    <option>Cake</option>
    <option>Cookies</option>
     <option>Pastries</option>
  </select>
</div>



  
  <div class="input-group">
    <button class="btn btn-success" type="submit">submit</button>
</div>

</div>

  


</body>
</html>
