<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Signup</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</head>
<body>
<div class="container-fluid">

<div class="container-fluid bg-primary" style="border-top: 40px solid #007bff;">
       <div class="card w-50 mx-auto"><!-- white signup card -->

       <div class="card-body"><!-- white signup card body -->

                       <h3 class="display-6 text-dark">Sign Up</h3>
                       <p>Please fill in this form to create an account!</p>



           <form>
                <div class="row mb-3">
                        <div class="col">
                                    <input type="text" class="form-control" placeholder="Enter firstname" name="fname">
                                </div>
                        <div class="col">
                            <input type="text" class="form-control" placeholder="Enter lastname" name="lname">
                            </div>
                              </div>

            </form>
            <form>
               <div class="form-group">
                              
                             
                                   
                                      <input type="email" class="form-control" id="email" placeholder="Email" name="email">
                         </div>            
                <div class="form-group">             
                                     
                                    <input type="password" class="form-control" id="pwd" placeholder="Password" name="pswd">
                        </div>         
                <div class="form-group">                 
                                         <input type="password" class="form-control" id="pwd" placeholder="Confirm password" name="pswd">
                                
                        </div>

                        <div class="form-group form-check">
                                    <label class="form-check-label">
                                    <input class="form-check-input" type="checkbox" name="remember"> 
                                    I accept the <a href="#" class="link">Terms of Use</a> & <a href="#" class="link">Privacy Policy</a>
                                    </label>
                        </div>
                    <button type="submit" class="btn btn-primary px-5 fw-bold">Sign Up</button>


            </form>
            
                       






        </div><!-- white signup card body -->
    </div> <!--closing div of blue card body-->
<div class="card-footer text-white text-center">Already have an account?<a href="#" class="link-white">Login here</a></div><!--open div of blue card footer-->
  
</div><!--closing div of blue card footer-->
</div>
</div><!--closing div of container-fluid body-->

    
</body>
</html>
