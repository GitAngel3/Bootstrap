<!DOCTYPE html>
<html>
<head>
    <title>5 Equal Columns</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="row">
        <div class="col bg-primary text-white text-center">Column 1</div>
        <div class="col bg-secondary text-white text-center">Column 2</div>
        <div class="col bg-success text-white text-center">Column 3</div>
        <div class="col bg-danger text-white text-center">Column 4</div>
        <div class="col bg-warning text-dark text-center">Column 5</div>
    </div>
</div>

</body>
</html>
