<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Layout</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

    <!-- jQuery, Popper, Bootstrap JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>

<body>

<div class="container-fluid">

    <!-- First Row -->
    <div class="row" style="height:150px;">
        <div class="col" style="background-color:pink;">
            .col
        </div>
    </div>

    <!-- Second Row -->
    <div class="row" style="height:150px;">
        <div class="col" style="background-color:rgb(23, 225, 47);">
            .col
        </div>

        <div class="col">
            <div class="row" style="height:75px; background-color:rgb(94, 94, 183);">
                Nested Row 1
            </div>
            <div class="row" style="height:75px; background-color:rgb(214, 30, 189);">
                Nested Row 2
            </div>
        </div>
    </div>

</div>

</body>
</html>
